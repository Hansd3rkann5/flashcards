<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T-Shirt Designer: Single Canvas</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #2c2f33; 
            color: #ffffff; 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }
        h1 { margin-top: 0; font-weight: 300; text-align: center; margin-bottom: 20px; }
        
        .layout {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 1200px;
            align-items: center;
        }

        /* Horizontales Menü (Row Layout) */
        .controls {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            gap: 20px;
            width: 100%;
            background: #23272a;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            justify-content: space-between;
        }

        .control-panel {
            flex: 1;
            min-width: 220px;
            background: #2c2f33;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #444;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .section-title {
            color: #43b581;
            font-weight: bold;
            border-bottom: 1px solid #43b581;
            padding-bottom: 5px;
            margin-bottom: 5px;
            font-size: 1rem;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .control-group label {
            display: flex;
            justify-content: space-between;
            color: #99aab5;
            font-weight: bold;
            font-size: 0.85rem;
        }
        .control-group input[type="color"] {
            width: 100%;
            height: 35px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            background: none;
        }
        .control-group select, .control-group input[type="range"] {
            width: 100%;
            padding: 6px;
            border-radius: 4px;
            border: 1px solid #555;
            background: #111;
            color: white;
            font-size: 0.9rem;
        }

        .instructions {
            width: 100%;
            text-align: center;
            font-size: 0.9rem;
            color: #b9bbbe;
            margin-bottom: 10px;
        }

        /* Einzelne Zeichenfläche */
        .workspace-container {
            width: 100%;
            max-width: 600px;
            background: #23272a;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        .workspace {
            background-color: #ffffff;
            background-image: url('data:image/svg+xml;utf8,<svg width="20" height="20" xmlns="http://www.w3.org/2000/svg"><rect width="20" height="20" fill="none"/><rect width="10" height="10" fill="%23e0e0e0"/><rect x="10" y="10" width="10" height="10" fill="%23e0e0e0"/></svg>');
            background-size: 20px 20px;
            border: 2px solid #111;
            border-radius: 8px;
            overflow: hidden;
            width: 100%;
            aspect-ratio: 1 / 1;
            position: relative;
        }

        svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .draggable { cursor: grab; }
        .draggable:active { cursor: grabbing; }
        .draggable:hover { opacity: 0.7; }

        button.export-btn {
            background-color: #43b581;
            color: white;
            border: none;
            padding: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: auto;
        }
        button.export-btn:hover { background-color: #3ca374; }

        .toggle-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #555;
            background: #111;
            color: #ccc;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.15s, color 0.15s, border-color 0.15s;
            user-select: none;
        }
        .toggle-btn.active {
            background: #43b581;
            border-color: #43b581;
            color: white;
        }
        .toggle-btn .toggle-indicator {
            font-size: 0.75rem;
            font-weight: bold;
            letter-spacing: 0.05em;
            opacity: 0.8;
        }

    </style>
</head>
<body>

    <h1>T-Shirt Designer: "Record"</h1>

    <div class="layout">
        
        <!-- Horizontales Menü -->
        <div class="controls">
            
            <!-- Panel 1: Farben -->
            <div class="control-panel">
                <div class="section-title">🎨 Farben</div>
                <div class="control-group">
                    <label for="color-rec">REC-Punkt:</label>
                    <input type="color" id="color-rec" value="#ff0000">
                </div>
                <div class="control-group">
                    <label for="color-rec-line">REC-Rahmen:</label>
                    <input type="color" id="color-rec-line" value="#111111">
                </div>
                <div class="control-group">
                    <label for="color-wave">Welle:</label>
                    <input type="color" id="color-wave" value="#111111">
                </div>
                <div class="control-group">
                    <label for="color-text">Text:</label>
                    <input type="color" id="color-text" value="#111111">
                </div>
            </div>

            <!-- Panel 2: Element Styles -->
            <div class="control-panel">
                <div class="section-title">📐 Element-Styles</div>
                <div class="control-group">
                    <label for="style-rec">REC-Button Style:</label>
                    <select id="style-rec">
                        <option value="modern">Modern Clean (Box)</option>
                        <option value="retro">Retro (Text + Punkt)</option>
                        <option value="bold">Urban Bold (Groß)</option>
                        <option value="minimal">Minimalist (Kreise)</option>
                    </select>
                </div>
                <div class="control-group">
                    <label for="style-text">Text Style:</label>
                    <select id="style-text">
                        <option value="modern">Modern (Arial)</option>
                        <option value="retro">Retro (Courier New)</option>
                        <option value="bold">Bold (Impact)</option>
                        <option value="minimal">Minimal (Georgia Italic)</option>
                    </select>
                </div>
            </div>

            <!-- Panel 3: Welle -->
            <div class="control-panel">
                <div class="section-title">📈 Wellen-Form</div>
                <div class="control-group">
                    <label for="wave-type">Linientyp:</label>
                    <select id="wave-type">
                        <option value="sine">Sinus (Weich)</option>
                        <option value="square">Rechteck (Digital)</option>
                        <option value="triangle">Dreieck (Zacken)</option>
                    </select>
                </div>
                <div class="control-group">
                    <label for="wave-amp">Amplitude: <span id="amp-val">30</span></label>
                    <input type="range" id="wave-amp" min="0" max="100" value="30">
                </div>
                <div class="control-group">
                    <label for="wave-freq">Frequenz: <span id="freq-val">1.5</span></label>
                    <input type="range" id="wave-freq" min="0.5" max="10" step="0.5" value="1.5">
                </div>
                <div class="control-group">
                    <label for="wave-damp">Dämpfung: <span id="damp-val">1.0</span></label>
                    <input type="range" id="wave-damp" min="0" max="4" step="0.1" value="1.0">
                </div>
            </div>

            <!-- Panel 4: Elemente -->
            <div class="control-panel">
                <div class="section-title">🧩 Elemente</div>
                <button class="toggle-btn active" id="toggle-rec" onclick="toggleElement('group-rec', this)">
                    <span>REC-Button</span><span class="toggle-indicator">AN</span>
                </button>
                <button class="toggle-btn active" id="toggle-wave" onclick="toggleElement('group-wave', this)">
                    <span>Welle</span><span class="toggle-indicator">AN</span>
                </button>
                <button class="toggle-btn active" id="toggle-text" onclick="toggleElement('group-text', this)">
                    <span>Text</span><span class="toggle-indicator">AN</span>
                </button>
            </div>

            <!-- Panel 5: Aktion -->
            <div class="control-panel" style="justify-content: center;">
                <button class="export-btn" onclick="exportSVG()">Als SVG speichern</button>
            </div>
            
        </div>

        <!-- Zeichenfläche -->
        <div class="instructions">
            <strong>🖱️ Steuerung:</strong> Elemente anklicken und verschieben. Zum Skalieren: Maus über das Element halten und langsam scrollen.
        </div>

        <div class="workspace-container">
            <div class="workspace">
                <svg id="main-canvas" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
                    
                    <!-- Gruppe: REC Button -->
                    <g id="group-rec" class="draggable" data-x="250" data-y="100" data-scale="1" transform="translate(250, 100) scale(1)">
                        <!-- Inhalt wird über JS injiziert -->
                    </g>

                    <!-- Gruppe: Welle -->
                    <g id="group-wave" class="draggable" data-x="250" data-y="250" data-scale="1" transform="translate(250, 250) scale(1)">
                        <path id="wave-path" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" class="color-target-wave" />
                        <rect id="wave-drag-box" x="-200" y="-100" width="400" height="200" fill="transparent" />
                    </g>

                    <!-- Gruppe: Text -->
                    <g id="group-text" class="draggable" data-x="250" data-y="400" data-scale="1" transform="translate(250, 400) scale(1)">
                        <text id="text-element" x="0" y="0" font-family="Arial, Helvetica, sans-serif" font-size="70" font-weight="900" fill="currentColor" text-anchor="middle" dominant-baseline="middle" class="color-target-text">ord</text>
                    </g>

                </svg>
            </div>
        </div>

    </div>

    <script>
        // --- 1. DEFINITION DER STYLES ---

        const recStyles = {
            modern: `
                <rect x="-40" y="-20" width="80" height="40" rx="8" fill="none" stroke="currentColor" stroke-width="3" class="color-target-rec-line"/>
                <circle cx="0" cy="0" r="12" fill="#ff0000" class="color-target-rec" />
                <rect x="-40" y="-20" width="80" height="40" fill="transparent" />
            `,
            retro: `
                <circle cx="-35" cy="0" r="14" fill="#ff0000" class="color-target-rec" />
                <text x="-10" y="10" font-family="'Courier New', Courier, monospace" font-size="36" font-weight="bold" fill="currentColor" class="color-target-rec-line">REC</text>
                <rect x="-55" y="-20" width="130" height="40" fill="transparent" />
            `,
            bold: `
                <circle cx="0" cy="0" r="24" fill="#ff0000" class="color-target-rec" />
                <rect x="-30" y="-30" width="60" height="60" fill="transparent" />
            `,
            minimal: `
                <circle cx="0" cy="0" r="12" fill="none" stroke="currentColor" stroke-width="2" class="color-target-rec-line"/>
                <circle cx="0" cy="0" r="6" fill="#ff0000" class="color-target-rec"/>
                <rect x="-20" y="-20" width="40" height="40" fill="transparent" />
            `
        };

        const textStyles = {
            modern: { family: "Arial, Helvetica, sans-serif", size: "65", weight: "900", text: "ord", letterSpacing: "0" },
            retro: { family: "'Courier New', Courier, monospace", size: "75", weight: "bold", text: "ord", letterSpacing: "0" },
            bold: { family: "Impact, 'Arial Black', sans-serif", size: "90", weight: "normal", text: "ORD", letterSpacing: "2" },
            minimal: { family: "Georgia, serif", size: "55", weight: "normal", style: "italic", text: "ord", letterSpacing: "4" }
        };


        // --- 2. ELEMENTE AKTUALISIEREN ---

        const styleRecSelect = document.getElementById('style-rec');
        const styleTextSelect = document.getElementById('style-text');
        
        function updateRecElement() {
            const group = document.getElementById('group-rec');
            group.innerHTML = recStyles[styleRecSelect.value];
            updateColors(); // Farben neu anwenden, da innerHTML alte Inline-Styles löscht
        }

        function updateTextElement() {
            const tEl = document.getElementById('text-element');
            const conf = textStyles[styleTextSelect.value];
            
            tEl.setAttribute('font-family', conf.family);
            tEl.setAttribute('font-size', conf.size);
            tEl.setAttribute('font-weight', conf.weight);
            tEl.setAttribute('letter-spacing', conf.letterSpacing);
            tEl.textContent = conf.text;
            
            if (conf.style) {
                tEl.setAttribute('font-style', conf.style);
            } else {
                tEl.removeAttribute('font-style');
            }
        }

        styleRecSelect.addEventListener('change', updateRecElement);
        styleTextSelect.addEventListener('change', updateTextElement);


        // --- 3. WELLEN GENERATOR ---

        const waveTypeSelect = document.getElementById('wave-type');
        const waveAmpInput = document.getElementById('wave-amp');
        const waveFreqInput = document.getElementById('wave-freq');
        const waveDampInput = document.getElementById('wave-damp');

        function drawWave() {
            const type = waveTypeSelect.value;
            const amp = parseFloat(waveAmpInput.value);
            const freq = parseFloat(waveFreqInput.value);
            const damp = parseFloat(waveDampInput.value);

            document.getElementById('amp-val').innerText = amp;
            document.getElementById('freq-val').innerText = freq;
            document.getElementById('damp-val').innerText = damp;

            // Parameter für die Zeichenfläche
            const width = 400;
            const startX = -200;
            const waveWidth = 200; 
            const waveStartX = -100;
            
            let d = `M ${startX},0 L ${waveStartX},0 `;
            const steps = type === 'square' ? 500 : 200; 
            
            for (let i = 0; i <= steps; i++) {
                let t = i / steps;
                let x = waveStartX + (waveWidth) * t;
                let phase = t * Math.PI * 2 * freq;
                let y = 0;

                if (type === 'sine') {
                    y = Math.sin(phase) * amp;
                } else if (type === 'square') {
                    y = Math.sin(phase) >= 0 ? amp : -amp;
                } else if (type === 'triangle') {
                    y = (2 * amp / Math.PI) * Math.asin(Math.sin(phase));
                }
                
                if (damp > 0) {
                    y = y * Math.pow(1 - t, damp);
                }
                
                d += `L ${x},${-y} `;
            }
            
            d += `L ${startX + width},0`;
            document.getElementById('wave-path').setAttribute('d', d);

            // Hitbox eng an tatsächliche Wellenhöhe anpassen
            const hitH = Math.max(30, amp * 2 + 16);
            const dragBox = document.getElementById('wave-drag-box');
            dragBox.setAttribute('y', -(hitH / 2));
            dragBox.setAttribute('height', hitH);
        }

        waveTypeSelect.addEventListener('change', drawWave);
        waveAmpInput.addEventListener('input', drawWave);
        waveFreqInput.addEventListener('input', drawWave);
        waveDampInput.addEventListener('input', drawWave);


        // --- 4. FARBEN ANPASSEN ---

        const colorRec = document.getElementById('color-rec');
        const colorRecLine = document.getElementById('color-rec-line');
        const colorWave = document.getElementById('color-wave');
        const colorText = document.getElementById('color-text');

        function updateColors() {
            document.querySelectorAll('.color-target-rec').forEach(el => {
                el.setAttribute('fill', colorRec.value);
            });
            document.querySelectorAll('.color-target-rec-line').forEach(el => {
                if(el.tagName === 'path' || el.tagName === 'rect' || (el.tagName === 'circle' && el.getAttribute('fill') === 'none')) {
                    el.setAttribute('stroke', colorRecLine.value);
                } else {
                    el.setAttribute('fill', colorRecLine.value);
                }
            });
            document.querySelectorAll('.color-target-wave').forEach(el => {
                el.setAttribute('stroke', colorWave.value);
            });
            document.querySelectorAll('.color-target-text').forEach(el => {
                el.setAttribute('fill', colorText.value);
            });
        }

        colorRec.addEventListener('input', updateColors);
        colorRecLine.addEventListener('input', updateColors);
        colorWave.addEventListener('input', updateColors);
        colorText.addEventListener('input', updateColors);


        // --- 5. DRAG, DROP & SCROLL LOGIK ---

        const svgCanvas = document.getElementById('main-canvas');
        let selectedElement = null;
        let offset = { x: 0, y: 0 };

        function getMousePosition(evt) {
            const CTM = svgCanvas.getScreenCTM();
            if (evt.touches) {
                return {
                    x: (evt.touches[0].clientX - CTM.e) / CTM.a,
                    y: (evt.touches[0].clientY - CTM.f) / CTM.d
                };
            }
            return {
                x: (evt.clientX - CTM.e) / CTM.a,
                y: (evt.clientY - CTM.f) / CTM.d
            };
        }

        function updateTransform(element) {
            const x = parseFloat(element.getAttribute('data-x'));
            const y = parseFloat(element.getAttribute('data-y'));
            const s = parseFloat(element.getAttribute('data-scale'));
            element.setAttribute('transform', `translate(${x}, ${y}) scale(${s})`);
        }

        function startDrag(evt) {
            let target = evt.target;
            while (target && target.tagName !== 'svg') {
                if (target.classList && target.classList.contains('draggable')) {
                    selectedElement = target;
                    break;
                }
                target = target.parentNode;
            }

            if (selectedElement) {
                // In SVG bestimmt die DOM-Reihenfolge den Z-Index → nach oben bringen
                selectedElement.parentNode.appendChild(selectedElement);

                const mousePos = getMousePosition(evt);
                const currentX = parseFloat(selectedElement.getAttribute('data-x'));
                const currentY = parseFloat(selectedElement.getAttribute('data-y'));
                offset.x = mousePos.x - currentX;
                offset.y = mousePos.y - currentY;
            }
        }

        function drag(evt) {
            if (selectedElement) {
                evt.preventDefault(); 
                const mousePos = getMousePosition(evt);
                selectedElement.setAttribute('data-x', mousePos.x - offset.x);
                selectedElement.setAttribute('data-y', mousePos.y - offset.y);
                updateTransform(selectedElement);
            }
        }

        function endDrag() {
            selectedElement = null;
        }

        function handleScroll(evt) {
            let targetGroup = null;
            let target = evt.target;
            
            while (target && target.tagName !== 'svg') {
                if (target.classList && target.classList.contains('draggable')) {
                    targetGroup = target;
                    break;
                }
                target = target.parentNode;
            }

            if (targetGroup) {
                evt.preventDefault(); 
                let scale = parseFloat(targetGroup.getAttribute('data-scale'));
                const scrollDirection = Math.sign(evt.deltaY); 
                const zoomFactor = 0.015;

                if (scrollDirection < 0) scale += zoomFactor; 
                else if (scrollDirection > 0) scale -= zoomFactor; 

                if (scale < 0.2) scale = 0.2;
                if (scale > 5.0) scale = 5.0;

                targetGroup.setAttribute('data-scale', scale);
                updateTransform(targetGroup);
            }
        }

        svgCanvas.addEventListener('mousedown', startDrag);
        svgCanvas.addEventListener('touchstart', startDrag, {passive: false});
        svgCanvas.addEventListener('wheel', handleScroll, {passive: false});

        window.addEventListener('mousemove', drag);
        window.addEventListener('touchmove', drag, {passive: false});
        window.addEventListener('mouseup', endDrag);
        window.addEventListener('touchend', endDrag);
        window.addEventListener('touchcancel', endDrag);


        // --- 6. EXPORT SVG FUNKTION ---
        
        function exportSVG() {
            const svgData = document.getElementById('main-canvas').cloneNode(true);

            const hilfsBoxen = svgData.querySelectorAll('rect[fill="transparent"]');
            hilfsBoxen.forEach(box => box.remove());

            // Ausgeblendete Gruppen entfernen
            svgData.querySelectorAll('[style*="display: none"]').forEach(el => el.remove());

            svgData.querySelectorAll('.color-target-rec').forEach(el => {
                el.setAttribute('fill', colorRec.value);
            });
            svgData.querySelectorAll('.color-target-rec-line').forEach(el => {
                if(el.tagName === 'path' || el.tagName === 'rect' || (el.tagName === 'circle' && el.getAttribute('fill') === 'none')) {
                    el.setAttribute('stroke', colorRecLine.value);
                } else {
                    el.setAttribute('fill', colorRecLine.value);
                }
            });
            svgData.querySelectorAll('.color-target-wave').forEach(el => {
                el.setAttribute('stroke', colorWave.value);
            });
            svgData.querySelectorAll('.color-target-text').forEach(el => {
                el.setAttribute('fill', colorText.value);
            });

            svgData.style.background = "transparent";
            svgData.style.backgroundColor = "transparent";

            const serializer = new XMLSerializer();
            let source = serializer.serializeToString(svgData);

            if(!source.match(/^<svg[^>]+xmlns="http\:\/\/www\.w3\.org\/2000\/svg"/)){
                source = source.replace(/^<svg/, '<svg xmlns="http://www.w3.org/2000/svg"');
            }

            const blob = new Blob([source], {type: "image/svg+xml;charset=utf-8"});
            const url = URL.createObjectURL(blob);
            
            const link = document.createElement("a");
            link.href = url;
            link.download = `record_tshirt_design.svg`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // --- 7. ELEMENTE EIN-/AUSBLENDEN ---

        function toggleElement(groupId, btn) {
            const group = document.getElementById(groupId);
            const isActive = btn.classList.contains('active');
            if (isActive) {
                group.style.display = 'none';
                btn.classList.remove('active');
                btn.querySelector('.toggle-indicator').textContent = 'AUS';
            } else {
                group.style.display = '';
                btn.classList.add('active');
                btn.querySelector('.toggle-indicator').textContent = 'AN';
            }
        }

        // --- INIT ---
        updateRecElement();
        updateTextElement();
        drawWave();

    </script>
</body>
</html>
